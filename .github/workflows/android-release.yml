name: Android APK

# Builds an installable APK on every push to main and publishes it as a GitHub
# Release, so the POC can be downloaded straight onto a phone.
#
# No Expo account, EAS credits or signing secrets are needed: `expo prebuild`
# generates the Android project, and the React Native template signs `release`
# with the checked-in debug keystore. That keystore is identical on every run,
# so successive builds install over each other instead of forcing an uninstall.

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the app.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: poc-v<run number>)'
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires >= 20.19.4.
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Stamp the build number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Assemble release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the artifact
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "APK not found at $SRC"; ls -R android/app/build/outputs || true; exit 1; }
          OUT="rsn-one-poc-build${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "path=mobile/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsn-one-poc-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || format('poc-v{0}', github.run_number) }}
          name: RSN One POC — build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            **Download `${{ steps.apk.outputs.name }}`** below and open it on an Android phone.

            Android will warn about installing outside the Play Store — allow it for
            your browser or file manager, then install. Signed with the React Native
            debug keystore, so each build installs over the last one.

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Size | ${{ steps.apk.outputs.size }} |
            | Package | `com.rsnone.poc` |

            This is a prototype: no backend, no database. State resets when the
            app is reopened.
