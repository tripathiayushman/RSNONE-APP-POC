name: Android APK

# Builds an installable APK on EAS and publishes it as a GitHub Release, so the
# POC can be downloaded straight onto a phone.
#
# Requires one repo secret: EXPO_TOKEN (expo.dev → Settings → Access tokens).
# The Expo project must also be linked once with `npx eas init` inside mobile/,
# which writes extra.eas.projectId into app.json.
#
# There is a no-account fallback in android-release-local.yml that builds with
# Gradle on the runner instead; run it manually if EAS is unavailable.

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the app.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: poc-v<run number>)'
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build APK on EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 57 requires >= 20.19.4.
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Fail early if EXPO_TOKEN is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            echo "Generate one at https://expo.dev/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN present."

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Fail early if the Expo project is not linked
        run: |
          node -e "
            const app = require('./app.json');
            const id = app?.expo?.extra?.eas?.projectId;
            if (!id) {
              console.error('::error::app.json has no extra.eas.projectId. Run \`npx eas init\` inside mobile/ once, then commit app.json.');
              process.exit(1);
            }
            console.log('EAS project linked:', id);
          "

      - name: Build on EAS and wait
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json
          cat build.json

      - name: Download the APK
        id: apk
        run: |
          URL=$(node -e "
            const b = require('./build.json');
            const build = Array.isArray(b) ? b[0] : b;
            const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
            if (!url) { console.error('No build URL in build.json'); process.exit(1); }
            console.log(url);
          ")
          OUT="rsn-one-poc-build${{ github.run_number }}.apk"
          curl -fL -o "$OUT" "$URL"
          test -s "$OUT" || { echo "Downloaded APK is empty"; exit 1; }
          echo "path=mobile/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsn-one-poc-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || format('poc-v{0}', github.run_number) }}
          name: RSN One POC — build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            **Download `${{ steps.apk.outputs.name }}`** below and open it on an Android phone.

            Android will warn about installing outside the Play Store — allow it for
            your browser or file manager, then install.

            | | |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Size | ${{ steps.apk.outputs.size }} |
            | Package | `com.rsnone.poc` |
            | Built by | EAS, `preview` profile |

            This is a prototype: no backend, no database. State resets when the
            app is reopened.
