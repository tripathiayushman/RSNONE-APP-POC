name: Android APK (Gradle fallback)

# Force a Gradle build even when EXPO_TOKEN is set.
#
# android-release.yml already falls back to Gradle on its own when the token is
# absent, so this is only needed when EAS *is* configured but you don't want to
# wait for it — a queued free-tier build the morning of a demo, say.
#
# One caveat when reaching for it that morning: this APK is signed with the RN
# template's debug keystore, while EAS builds are signed with the EAS-managed
# one. A phone that already has an EAS-built APK can't install this one over
# it (signature mismatch) — uninstall the app first, then install this build.
#
# Manual only, and it uploads a workflow artifact rather than creating a
# Release, so it can never collide with the tags android-release.yml publishes.
# Download it from the run's "Artifacts" section.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node pin from the SDK-57 era; SDK 54 runs fine on it too.
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Stamp the build number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}$" android/app/build.gradle || { echo "::error::versionCode stamp did not apply — prebuild template changed?"; exit 1; }

      - name: Assemble release APK
        # The React Native template signs `release` with the debug keystore it
        # ships, so this needs no signing secrets and keeps a stable signature.
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the artifact
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "APK not found at $SRC"; ls -R android/app/build/outputs || true; exit 1; }
          OUT="rsn-one-poc-gradle-build${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "path=mobile/$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rsn-one-poc-apk-gradle
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
